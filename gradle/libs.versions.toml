composeMultiplatform = "1.8.2"
junit = "4.13.2"
kotlin = "2.2.0"
landscapist-coil = "2.4.8"
cameraX = "1.4.2"
compose = "1.8.0"
compose-material3 = "1.1.2"
compottie="2.0.0-rc04"
androidx-activityCompose = "1.8.0"
ktor = "3.1.3"
koin = "4.1.0"
sqldelight = "2.0.1"
kotlinx-serialization = "1.6.2"
kotlinx-coroutines = "1.7.3"
kotlinx-datetime = "0.5.0"
stately = "2.0.5"
kotlinStdlib = "2.0.0"
runner = "1.6.2"
